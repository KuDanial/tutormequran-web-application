<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account - TutorMeQuran</title>
  
  <!-- SEO & Description -->
  <meta name="description" content="Create a student or tutor account on TutorMeQuran. Upload Ijazah certificates, fill in details, and join Malaysia's leading Quran booking network.">
  
  <!-- FontAwesome & App Stylesheet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Full Page Center Onboarding Wrapper -->
  <main class="auth-page" style="padding: 4rem 1.5rem;">
    <div class="auth-card" style="max-width: 600px;">
      
      <!-- Logo and Header -->
      <div class="auth-logo-wrapper">
        <a href="index.html">
          <img src="assets/img/TutorMeQuran_LOGO.png" alt="TutorMeQuran Logo" class="auth-logo">
        </a>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join as a student or register as a certified tutor</p>
      </div>

      <!-- Segmented Role Selector (FR1 & User Roles) -->
      <div class="segmented-control" id="register-role-selector">
        <button type="button" class="segment-btn active" data-role="student" id="register-btn-student">
          <i class="fas fa-graduation-cap"></i> Student
        </button>
        <button type="button" class="segment-btn" data-role="tutor" id="register-btn-tutor">
          <i class="fas fa-chalkboard-teacher"></i> Tutor
        </button>
      </div>

      <!-- Onboarding Form -->
      <form id="registration-form">
        <!-- Hidden input storing selected registration role -->
        <input type="hidden" id="register-role" value="student">

        <!-- FName & LName Grid -->
        <div class="form-row">
          <div class="form-group">
            <label for="fname" class="form-label">First Name <span class="required">*</span></label>
            <div class="form-input-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input type="text" id="fname" class="form-control" placeholder="Ahmad" required>
            </div>
          </div>
          <div class="form-group">
            <label for="lname" class="form-label">Last Name <span class="required">*</span></label>
            <div class="form-input-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input type="text" id="lname" class="form-control" placeholder="Shukri" required>
            </div>
          </div>
        </div>

        <!-- IC Number & Phone Grid -->
        <div class="form-row">
          <div class="form-group">
            <label for="icnum" class="form-label">IC Number <span class="required">*</span></label>
            <div class="form-input-wrapper">
              <i class="fas fa-id-card input-icon"></i>
              <input type="text" id="icnum" class="form-control" placeholder="981220-10-5341" required>
            </div>
            <span style="font-size: 0.75rem; color: var(--text-light); margin-top: 0.25rem; display: block;">Format: XXXXXX-XX-XXXX</span>
          </div>
          <div class="form-group">
            <label for="phone" class="form-label">Phone Number <span class="required">*</span></label>
            <div class="form-input-wrapper">
              <i class="fas fa-phone input-icon"></i>
              <input type="tel" id="phone" class="form-control" placeholder="+6012-3456789" required>
            </div>
          </div>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address <span class="required">*</span></label>
          <div class="form-input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-control" placeholder="ahmad@gmail.com" required>
          </div>
        </div>

        <!-- Home Address -->
        <div class="form-group">
          <label for="address" class="form-label">Home Address <span class="required">*</span></label>
          <div class="form-input-wrapper">
            <i class="fas fa-map-marker-alt input-icon"></i>
            <input type="text" id="address" class="form-control" placeholder="No. 12, Jalan Sultan Ismail, Kuala Lumpur" required>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password <span class="required">*</span></label>
          <div class="form-input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            <i class="fas fa-eye-slash toggle-password"></i>
          </div>
        </div>

        <!-- DYNAMIC TUTOR SECTION (Revealed only if Tutor is selected) -->
        <div class="dynamic-tutor-section" id="tutor-credentials-section">
          <div class="tutor-section-title">
            <i class="fas fa-scroll"></i> Tutor Verification & Pricing (FR8)
          </div>

          <div class="form-row">
            <!-- Hourly Rate -->
            <div class="form-group">
              <label for="hourly-rate" class="form-label">Hourly Rate (RM/hr) <span class="required">*</span></label>
              <div class="form-input-wrapper">
                <i class="fas fa-money-bill-wave input-icon"></i>
                <input type="number" id="hourly-rate" class="form-control" min="1" placeholder="40">
              </div>
            </div>
            <!-- Qualifications -->
            <div class="form-group">
              <label for="qualifications" class="form-label">Teaching Experience</label>
              <div class="form-input-wrapper">
                <i class="fas fa-graduation-cap input-icon"></i>
                <select id="qualifications" class="form-control" style="padding-left: 2.5rem; appearance: none; background-image: url(&quot;data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234b5563' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e&quot;); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1rem;">
                  <option value="1-3">1 - 3 Years</option>
                  <option value="3-5">3 - 5 Years</option>
                  <option value="5+">5+ Years</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Biography -->
          <div class="form-group">
            <label for="bio" class="form-label">Tutor Biography & Expertise</label>
            <textarea id="bio" class="form-control" rows="3" placeholder="Tell students about your credentials, background, and teaching methodology..."></textarea>
          </div>

          <!-- Crucial File Upload Labeled Specifically "Upload Ijazah Certificate for Verification" -->
          <div class="form-group">
            <label class="form-label">Upload Ijazah Certificate for Verification <span class="required">*</span></label>
            
            <div class="file-upload-container">
              <!-- Drag and Drop Zone -->
              <div class="file-upload-dropzone" id="ijazah-dropzone">
                <i class="fas fa-cloud-upload-alt file-upload-icon"></i>
                <div class="file-upload-text">Drag and drop file here, or <span>browse</span></div>
                <div class="file-upload-subtext">Supported formats: PDF, JPG, PNG (Max 5MB)</div>
                <!-- Hidden file input -->
                <input type="file" id="ijazah-upload" class="hidden-file-input" accept=".pdf, .jpg, .jpeg, .png">
              </div>

              <!-- Live File Preview -->
              <div class="upload-preview" id="ijazah-preview-container">
                <div class="preview-info">
                  <i class="fas fa-file-pdf preview-icon" id="preview-icon"></i>
                  <div>
                    <div class="preview-name" id="preview-file-name">certificate.pdf</div>
                    <div class="preview-size" id="preview-file-size">1.2 MB</div>
                  </div>
                </div>
                <i class="fas fa-trash-alt preview-remove-btn" id="preview-remove" title="Remove file"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- PDPA & Privacy Consent -->
        <div class="form-group" style="margin-top: 1.5rem; margin-bottom: 2rem;">
          <div class="form-checkbox-wrapper">
            <input type="checkbox" id="consent" class="form-checkbox" required>
            <label for="consent" class="checkbox-label">
              I agree to the <a href="#">Terms of Service</a> and consent to the processing of my personal details (including IC Number and contact information) in accordance with the Malaysian <strong>PDPA Act 2010</strong>. <span class="required">*</span>
            </label>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block" id="register-submit-btn">
          Create Account <i class="fas fa-user-plus"></i>
        </button>
      </form>

      <!-- Member Link -->
      <p class="checkbox-label" style="text-align: center; margin-top: 2rem;">
        Already have an account? <a href="login.html">Log In Here</a>
      </p>

      <!-- Back Link -->
      <a href="index.html" class="btn btn-text btn-block btn-sm" style="margin-top: 1rem;">
        <i class="fas fa-arrow-left"></i> Back to Landing Page
      </a>

    </div>
  </main>

  <!-- App Script -->
  <script src="assets/js/main.js"></script>
</body>
</html>
